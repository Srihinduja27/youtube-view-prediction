# YouTube Prediction MLOps Platform Configuration (Labs 7-13)

data:
  raw_dir: data/raw
  raw_path: data/raw/youtube_combined.csv
  new_data_path: data/raw/new_youtube.csv
  processed_dir: data/processed
  target_column: views
  id_column: video_id

split:
  test_size: 0.2
  random_state: 42

model:
  n_estimators: 100
  max_depth: 25
  min_samples_split: 5
  min_samples_leaf: 2
  max_features: log2
  random_state: 42
  n_jobs: -1

mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: YouTube_Views_Prediction

registry:
  model_name: YouTube_Views_Production_Model
  decision_metric: log_r2

quality_gate:
  metric: log_r2
  minimum_value: 0.65

paths:
  preprocessor: models/preprocessor.pkl
  model: models/random_forest_mlflow.pkl
  evaluation_report: reports/evaluation_report.json
  quality_gate_report: reports/quality_gate_report.json
  failure_report: reports/failure_report.json
  inference_output: outputs/inference_predictions.csv
